name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest -q

      - name: Prepare and inspect Worker bundle
        run: |
          uv run pywrangler sync
          uv run python scripts/prepare_worker_source.py
          uv run python scripts/check_worker_bundle.py
          uv run pywrangler deploy --dry-run --outdir .wrangler/bundle-check
          uv run python scripts/check_worker_bundle.py --bundle-dir .wrangler/bundle-check

      - name: Configure Shopify secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          PRODUCT_BROWSING_API_KEY: ${{ secrets.PRODUCT_BROWSING_API_KEY }}
        run: |
          test -n "$PRODUCT_BROWSING_API_KEY" || { echo "Add the PRODUCT_BROWSING_API_KEY GitHub Actions secret before deploying."; exit 1; }
          echo "$SHOPIFY_STORE_DOMAIN" | uv run pywrangler secret put SHOPIFY_STORE_DOMAIN
          echo "$SHOPIFY_CLIENT_ID" | uv run pywrangler secret put SHOPIFY_CLIENT_ID
          echo "$SHOPIFY_CLIENT_SECRET" | uv run pywrangler secret put SHOPIFY_CLIENT_SECRET
          echo "$PRODUCT_BROWSING_API_KEY" | uv run pywrangler secret put PRODUCT_BROWSING_API_KEY

      - name: Configure optional WhatChimp secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WHATCHIMP_API_TOKEN: ${{ secrets.WHATCHIMP_API_TOKEN }}
          WHATCHIMP_PHONE_NUMBER_ID: ${{ secrets.WHATCHIMP_PHONE_NUMBER_ID }}
          WHATCHIMP_INBOUND_API_KEY: ${{ secrets.WHATCHIMP_INBOUND_API_KEY }}
          WHATCHIMP_API_BASE_URL: ${{ vars.WHATCHIMP_API_BASE_URL }}
        run: |
          if [ -n "$WHATCHIMP_API_TOKEN$WHATCHIMP_PHONE_NUMBER_ID$WHATCHIMP_INBOUND_API_KEY" ]; then
            test -n "$WHATCHIMP_API_TOKEN" && test -n "$WHATCHIMP_PHONE_NUMBER_ID" && test -n "$WHATCHIMP_INBOUND_API_KEY" || { echo "Configure all three WhatChimp secrets together."; exit 1; }
            printf '%s' "$WHATCHIMP_API_TOKEN" | uv run pywrangler secret put WHATCHIMP_API_TOKEN
            printf '%s' "$WHATCHIMP_PHONE_NUMBER_ID" | uv run pywrangler secret put WHATCHIMP_PHONE_NUMBER_ID
            printf '%s' "$WHATCHIMP_INBOUND_API_KEY" | uv run pywrangler secret put WHATCHIMP_INBOUND_API_KEY
            printf '%s' "${WHATCHIMP_API_BASE_URL:-https://app.whatchimp.com/api/v1}" | uv run pywrangler secret put WHATCHIMP_API_BASE_URL
          fi

      - name: Configure optional encrypted button keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WHATCHIMP_BUTTON_TOKEN_KEY: ${{ secrets.WHATCHIMP_BUTTON_TOKEN_KEY }}
          WHATCHIMP_BUTTON_TOKEN_PREVIOUS_KEYS: ${{ secrets.WHATCHIMP_BUTTON_TOKEN_PREVIOUS_KEYS }}
        run: |
          if [ -n "$WHATCHIMP_BUTTON_TOKEN_KEY" ]; then
            printf '%s' "$WHATCHIMP_BUTTON_TOKEN_KEY" | uv run pywrangler secret put WHATCHIMP_BUTTON_TOKEN_KEY
            printf '%s' "$WHATCHIMP_BUTTON_TOKEN_PREVIOUS_KEYS" | uv run pywrangler secret put WHATCHIMP_BUTTON_TOKEN_PREVIOUS_KEYS
          fi

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy
